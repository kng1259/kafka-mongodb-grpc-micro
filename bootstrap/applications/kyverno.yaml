apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno
    targetRevision: 3.5.2
    helm:
      releaseName: kyverno
      # default installation ignore kyverno and system ns
      valuesObject:
        global:
          # allow kyverno to use same trust as node (configured separately)
          caCertificates:
            volume:
              hostPath:
                path: /usr/local/share/ca-certificates/poc4k-nexus-intern-ca.crt
                type: File
        config:
          preserve: false
        webhookLabels:
          app.kubernetes.io/managed-by: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      enabled: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
